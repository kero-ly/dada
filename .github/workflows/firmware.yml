name: C3 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build C3 bootstrap
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware set-target esp32c3
          idf.py -C firmware build
      - name: Save smoke firmware and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: c3-bootstrap-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/project_description.json
            firmware/sdkconfig
