name: C3 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Keep in sync with apps/*/app.json; every native app must build here.
        app: [touch-counter, bringup, focus-clock]
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build selected C3 application
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware -DDADA_APP=${{ matrix.app }} build
      - name: Save smoke firmware and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: c3-${{ matrix.app }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/project_description.json
            firmware/sdkconfig
