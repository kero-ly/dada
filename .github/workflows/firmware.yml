name: C3 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Keep in sync with apps/*/app.json; every native app must build here.
        include:
          - app: touch-counter
            env: dada-c3-touch-counter
          - app: bringup
            env: dada-c3-bringup
          - app: focus-clock
            env: dada-c3-focus-clock
          - app: snake
            env: dada-c3-snake
          - app: paint
            env: dada-c3-paint
          - app: whale
            env: dada-c3-whale
          - app: flappy
            env: dada-c3-flappy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # The ESP-IDF framework and both toolchains are ~1.2 GB; rebuilding
          # them from scratch on every run wastes bandwidth even though it fits
          # inside the timeout.
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO Core
        run: python -m pip install -r tools/requirements.txt
      - name: Build selected C3 application with PlatformIO
        run: |
          pio run -d firmware -e ${{ matrix.env }}
      - name: Save smoke firmware and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: c3-${{ matrix.app }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/.pio/build/${{ matrix.env }}/*.bin
            firmware/.pio/build/${{ matrix.env }}/*.elf
            firmware/.pio/build/${{ matrix.env }}/*.map
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
            firmware/.pio/build/${{ matrix.env }}/config/sdkconfig.h
