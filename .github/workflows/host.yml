name: Host application tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cmake -S tests/host -B tests/host/build
      - run: cmake --build tests/host/build
      - run: ctest --test-dir tests/host/build --output-on-failure
      - run: python -m unittest discover -s tests/host -p 'test_*.py'
