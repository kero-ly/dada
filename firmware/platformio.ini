[platformio]
default_envs = dada-c3-touch-counter
src_dir = main

[env]
platform = espressif32@6.8.1
framework = espidf
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_speed = 460800
board_build.cmake_extra_args =
    -DDADA_BOARD=jinyichen-esp32-c3-lcd-2.4

[env:dada-c3-bringup]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=bringup

[env:dada-c3-touch-counter]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=touch-counter

[env:dada-c3-focus-clock]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=focus-clock

[env:dada-c3-snake]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=snake

[env:dada-c3-paint]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=paint

[env:dada-c3-whale]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=whale

[env:dada-c3-flappy]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=flappy

[env:dada-c3-pet]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=pet

# ---------------------------------------------------------------------------
# Waveshare ESP32-S3-AUDIO-Board + 2inch ST7789 module on the GPIO header.
# No touch panel, so only display-only apps are listed.
# ---------------------------------------------------------------------------
[env:dada-s3-base]
platform = espressif32@6.8.1
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
# ESP-IDF accepts several defaults files; later ones win. The board-specific
# one must come after the shared one so 16 MB flash and PSRAM are not undone.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3.defaults"
    -DDADA_BOARD=waveshare-esp32-s3-audio-board
    # Brought up by hand before the manifest's capabilities were verified.
    -DDADA_ALLOW_UNVERIFIED=ON

[env:dada-s3-whale]
extends = env:dada-s3-base
board_build.cmake_extra_args =
    ${env:dada-s3-base.board_build.cmake_extra_args}
    -DDADA_APP=whale

[env:dada-s3-pet]
extends = env:dada-s3-base
board_build.cmake_extra_args =
    ${env:dada-s3-base.board_build.cmake_extra_args}
    -DDADA_APP=pet
