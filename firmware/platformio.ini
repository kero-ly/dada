[platformio]
default_envs = dada-c3-touch-counter
src_dir = main

[env]
platform = espressif32@6.8.1
framework = espidf
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_speed = 460800
board_build.cmake_extra_args =
    -DDADA_BOARD=jinyichen-esp32-c3-lcd-2.4

[env:dada-c3-bringup]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=bringup

[env:dada-c3-touch-counter]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=touch-counter

[env:dada-c3-focus-clock]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=focus-clock

[env:dada-c3-snake]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=snake

[env:dada-c3-paint]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=paint

[env:dada-c3-whale]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=whale

[env:dada-c3-flappy]
board_build.cmake_extra_args =
    ${env.board_build.cmake_extra_args}
    -DDADA_APP=flappy
